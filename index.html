<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>G.E.I360 | Gestão Empresarial</title>
<style>
:root{--nav:#101827;--green:#16866d;--bg:#f3f5f9;--line:#e5eaf1}*{box-sizing:border-box}body{margin:0;font:14px system-ui;background:var(--bg);color:#172033}button,input,select,textarea{font:inherit}button{border:0;border-radius:8px;padding:9px 13px;background:var(--green);color:white;cursor:pointer;font-weight:650}.alt{background:#eaf0f5;color:#263449}.danger{background:#fff0ef;color:#b83227}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#101827,#1a3a45);padding:20px}.loginbox{background:white;padding:28px;border-radius:16px;width:min(420px,100%)}.brand{font-size:22px;font-weight:850;margin-bottom:20px}.brand b{color:var(--green)}.field{display:grid;gap:5px;margin:10px 0}.field label{font-size:12px;font-weight:700;color:#526174}.field input,.field select,.field textarea,.search{padding:10px;border:1px solid #dce3ec;border-radius:8px;width:100%}.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:var(--nav);color:white;padding:16px 12px}.side .brand{padding:5px}.company{padding:10px;background:#ffffff14;border-radius:8px;font-size:12px;margin-bottom:12px}.nav{display:grid;gap:3px}.nav button{background:transparent;text-align:left;color:#c1ccda}.nav button.active,.nav button:hover{background:#ffffff19;color:white}.main{min-width:0}.top{background:white;padding:16px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.content{padding:22px;max-width:1400px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}.head h1{margin:0;font-size:24px}.muted{color:#718096}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}.metric{font-size:25px;font-weight:800}.tablewrap{overflow:auto;background:white;border:1px solid var(--line);border-radius:10px}table{border-collapse:collapse;width:100%;min-width:600px}td,th{text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:13px}th{background:#f8fafc;color:#718096;font-size:11px;text-transform:uppercase}.actions{display:flex;gap:5px}.small{font-size:11px;padding:6px 8px}.notice{padding:12px;background:#fff8e8;border:1px solid #f1dfb6;border-radius:9px;color:#78551a;margin:12px 0;line-height:1.5}.modalbg{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:15px}.modal{background:white;padding:20px;border-radius:14px;width:min(550px,100%);max-height:90vh;overflow:auto}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.full{grid-column:1/-1}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.search{flex:1;min-width:180px}.empty{text-align:center;color:#718096;padding:25px}
@media(max-width:850px){.shell{grid-template-columns:1fr}.side{padding:10px}.company{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.grid{grid-template-columns:repeat(2,1fr)}.content{padding:14px}.top{padding:12px}}@media(max-width:500px){.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.head{align-items:flex-start;flex-direction:column}}
</style></head><body>
<div id="login" class="login"><div class="loginbox"><div class="brand">G.E.I<b>360</b></div><h2>Acesso à plataforma</h2><p class="muted">Gestão empresarial integrada</p><div class="field"><label>E-mail</label><input id="email" type="email"></div><div class="field"><label>Senha</label><input id="password" type="password"></div><button style="width:100%" onclick="login()">Entrar</button><button class="alt" style="width:100%;margin-top:8px" onclick="demo()">Modo demonstração</button><p id="msg" class="muted"></p></div></div>
<div id="app" class="shell hidden"><aside class="side"><div class="brand">G.E.I<b>360</b></div><div class="company" id="company">G.E.I360 EMPRESA TESTE</div><nav class="nav" id="nav"></nav></aside><main class="main"><header class="top"><b id="title">Visão Geral</b><span><small id="who"></small> <button class="alt small" onclick="logout()">Sair</button></span></header><div class="content" id="view"></div></main></div>
<div class="modalbg" id="modal"><div class="modal"><div class="head"><b id="modalTitle">Novo registro</b><button class="alt small" onclick="closeModal()">Fechar</button></div><form id="form" onsubmit="save(event)"><div class="formgrid" id="fields"></div><p style="text-align:right"><button type="button" class="alt" onclick="closeModal()">Cancelar</button> <button>Salvar</button></p></form></div></div>
<script>
const URL='https://mxikqdarqgatqoecfprg.supabase.co',KEY='sb_publishable_C1PaxcWAdb5rLfd0yJjl5g_ZUQKK7Dk';
const mods=[['home','Visão Geral'],['customers','Clientes'],['suppliers','Fornecedores'],['products','Produtos e Serviços'],['stock','Estoque'],['purchases','Compras'],['sales','Vendas'],['pos','Frente de Caixa'],['finance','Financeiro'],['services','Gestão de Serviços'],['production','Produção e Indústria'],['employees','Recursos Humanos'],['fiscal','Fiscal'],['reports','Relatórios'],['branches','Multi Filial'],['audit','Auditoria'],['settings','Configurações']];
const C={
customers:['Clientes',[['name','Nome'],['document','CPF/CNPJ'],['email','E-mail'],['phone','Telefone'],['address','Endereço'],['notes','Observações','textarea']]],
suppliers:['Fornecedores',[['name','Nome'],['document','CPF/CNPJ'],['email','E-mail'],['phone','Telefone'],['address','Endereço']]],
products:['Produtos e Serviços',[['name','Descrição'],['sku','Código'],['category','Categoria'],['unit','Unidade'],['price','Preço','number'],['cost','Custo','number'],['min','Estoque mínimo','number']]],
stock:['Estoque',[['name','Produto'],['movement','Movimento','select','Entrada|Saída|Ajuste'],['quantity','Quantidade','number'],['reference','Documento']]],
purchases:['Compras',[['supplier','Fornecedor'],['description','Descrição'],['date','Data','date'],['total','Total','number'],['status','Situação','select','Em aberto|Recebida|Cancelada']]],
sales:['Vendas',[['customer','Cliente'],['description','Descrição'],['date','Data','date'],['total','Total','number'],['status','Situação','select','Em aberto|Concluída|Cancelada']]],
pos:['Frente de Caixa',[['description','Item/venda'],['quantity','Quantidade','number'],['unit_price','Preço unitário','number'],['payment','Pagamento','select','Dinheiro|PIX|Débito|Crédito|Outro']]],
finance:['Financeiro',[['description','Descrição'],['type','Tipo','select','Receita|Despesa'],['due_date','Vencimento','date'],['amount','Valor','number'],['status','Situação','select','Pendente|Pago|Recebido']]],
services:['Gestão de Serviços',[['customer','Cliente'],['description','Serviço'],['date','Data','date'],['value','Valor','number'],['status','Situação','select','Orçamento|Agendado|Em execução|Concluído']]],
production:['Produção e Indústria',[['product','Produto'],['order_no','Ordem'],['quantity','Quantidade','number'],['start_date','Início','date'],['status','Situação','select','Planejada|Em produção|Concluída']]],
employees:['Recursos Humanos',[['name','Nome completo'],['cpf','CPF'],['job','Cargo'],['department','Departamento'],['admission','Admissão','date'],['status','Situação','select','Ativo|Afastado|Desligado']]],
fiscal:['Fiscal',[['document','Documento','select','NF-e|NFC-e|NFS-e|CT-e'],['reference','Referência'],['amount','Valor','number'],['status','Situação','select','Rascunho|Aguardando integração|Autorizado externamente|Rejeitado'],['notes','Observações','textarea']]],
branches:['Multi Filial',[['name','Filial'],['document','CNPJ'],['address','Endereço'],['manager','Responsável'],['status','Situação','select','Ativa|Inativa']]]
};
let db=JSON.parse(localStorage.getItem('gei360_data')||'{}'),cur='home',edit=-1,token=null,mode='demo',companyName='G.E.I360 EMPRESA TESTE',user='';
const rows=k=>db[k]||[],saveDB=()=>localStorage.setItem('gei360_data',JSON.stringify(db)),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function login(){let email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password){msg.textContent='Informe e-mail e senha.';return}try{let r=await fetch(URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({email,password})}),j=await r.json();if(!r.ok)throw Error(j.msg||j.message||'Falha no login');token=j.access_token;user=email;mode='supabase';let x=await fetch(URL+'/rest/v1/rpc/get_my_companies',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+token},body:'{}'}),a=await x.json();if(Array.isArray(a)&&a[0])companyName=a[0].name;start()}catch(e){msg.textContent='Erro no acesso: '+e.message}}
function demo(){mode='demo';user='Demonstração';start()}function start(){loginEl.classList.add('hidden');app.classList.remove('hidden');company.textContent=companyName;who.textContent=user;nav.innerHTML=mods.map(([k,n])=>`<button data-k="${k}" onclick="go('${k}')">${n}</button>`).join('');go('home')}
function logout(){token=null;app.classList.add('hidden');loginEl.classList.remove('hidden')}function go(k){cur=k;title.textContent=(mods.find(x=>x[0]===k)||[])[1]||'Módulo';document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.k===k));render()}
function render(){if(cur==='home'){view.innerHTML=`<div class="head"><div><h1>Visão Geral</h1><span class="muted">Resumo da operação empresarial</span></div><small>${mode==='demo'?'Modo demonstração':'Login Supabase'}</small></div><div class="grid">${[['Clientes','customers'],['Produtos','products'],['Vendas','sales'],['Colaboradores','employees']].map(([n,k])=>`<div class="card"><span class="muted">${n}</span><div class="metric">${rows(k).length}</div></div>`).join('')}</div><div class="card"><b>Atalhos dos módulos</b><div class="toolbar" style="margin-top:12px">${mods.slice(1,9).map(([k,n])=>`<button class="alt" onclick="go('${k}')">${n}</button>`).join('')}</div></div><div class="notice">Importante: os cadastros desta entrega ficam no armazenamento local do navegador. O login Supabase está preservado, mas os formulários ainda não sincronizam com o banco.</div>`;return}
if(cur==='reports'){view.innerHTML=`<div class="head"><h1>Relatórios</h1><button onclick="backup()">Backup JSON</button></div><div class="grid">${Object.keys(C).map(k=>`<div class="card"><span class="muted">${C[k][0]}</span><div class="metric">${rows(k).length}</div></div>`).join('')}</div><button onclick="csvAll()">Exportar CSV</button>`;return}
if(cur==='audit'){view.innerHTML=`<div class="head"><h1>Auditoria local</h1><button onclick="backup()">Exportar backup</button></div>${table(rows('audit').slice().reverse(),['when','action','module','detail'])}`;return}
if(cur==='settings'){view.innerHTML=`<div class="head"><h1>Configurações</h1></div><div class="card"><div class="field"><label>Nome da empresa</label><input id="co" value="${E(companyName)}"></div><button onclick="companyName=co.value;company.textContent=companyName;alert('Nome atualizado nesta sessão')">Salvar nome</button> <button class="alt" onclick="backup()">Backup</button> <button class="alt" onclick="document.getElementById('file').click()">Restaurar backup</button> <input id="file" type="file" accept=".json" class="hidden" onchange="restore(event)"> <button class="danger" onclick="if(confirm('Apagar os dados locais?')){db={};saveDB();render()}">Apagar dados locais</button></div>`;return}
if(cur==='fiscal'||cur==='employees'||cur==='pos'){let note=cur==='fiscal'?'Emissão oficial não habilitada: exige certificado digital, credenciamento, configuração tributária e integração/homologação com SEFAZ ou prefeitura. Este módulo não transmite nem autoriza notas.':cur==='employees'?'Cadastro básico apenas. Não calcula folha legal, encargos, férias/rescisões nem transmite eSocial.':'PDV de registro simples. Não integra TEF, impressora fiscal, gaveta, balança ou emissão fiscal.';view.innerHTML=`<div class="head"><div><h1>${C[cur][0]}</h1></div><button onclick="openForm()">Novo registro</button></div><div class="notice">${note}</div>${table(rows(cur),C[cur][1].map(f=>f[0]))}`;return}
let c=C[cur];if(!c){view.innerHTML='<div class="card">Módulo em preparação.</div>';return}view.innerHTML=`<div class="head"><div><h1>${c[0]}</h1><span class="muted">Cadastro, pesquisa e manutenção</span></div><button onclick="openForm()">+ Novo registro</button></div><div class="toolbar"><input class="search" id="q" placeholder="Pesquisar..." oninput="filter()"><button class="alt" onclick="csvModule()">Exportar CSV</button></div><div id="table">${table(rows(cur),c[1].map(f=>f[0]))}</div>`}
const labels={name:'Nome',document:'Documento',email:'E-mail',phone:'Telefone',address:'Endereço',notes:'Observações',sku:'Código',category:'Categoria',unit:'Unidade',price:'Preço',cost:'Custo',min:'Mínimo',movement:'Movimento',quantity:'Quantidade',reference:'Referência',supplier:'Fornecedor',description:'Descrição',date:'Data',total:'Total',status:'Situação',customer:'Cliente',type:'Tipo',due_date:'Vencimento',amount:'Valor',value:'Valor',product:'Produto',order_no:'Ordem',start_date:'Início',cpf:'CPF',job:'Cargo',department:'Departamento',admission:'Admissão',manager:'Responsável',unit_price:'Preço unitário',payment:'Pagamento',when:'Data/hora',action:'Ação',module:'Módulo',detail:'Detalhe'};
function table(data,keys){if(!data.length)return '<div class="card empty">Nenhum registro cadastrado.</div>';return `<div class="tablewrap"><table><thead><tr>${keys.map(k=>`<th>${labels[k]||k}</th>`).join('')}<th>Ações</th></tr></thead><tbody>${data.map((r,i)=>`<tr>${keys.map(k=>`<td>${E(r[k])}</td>`).join('')}<td><div class="actions"><button class="alt small" onclick="openForm(${i})">Editar</button><button class="danger small" onclick="del(${i})">Excluir</button></div></td></tr>`).join('')}</tbody></table></div>`}
function openForm(i=-1){edit=i;let fields=C[cur][1],o=i<0?{}:rows(cur)[i];modalTitle.textContent=i<0?'Novo registro':'Editar registro';document.getElementById('fields').innerHTML=fields.map(([k,l,t,opt])=>{let val=E(o[k]??''),el=t==='textarea'?`<textarea name="${k}">${val}</textarea>`:t==='select'?`<select name="${k}">${opt.split('|').map(x=>`<option ${x===o[k]?'selected':''}>${x}</option>`).join('')}</select>`:`<input name="${k}" type="${t==='number'?'number':t==='date'?'date':'text'}" ${t==='number'?'step="0.01"':''} value="${val}">`;return `<div class="field ${t==='textarea'?'full':''}"><label>${l}</label>${el}</div>`}).join('');modal.style.display='flex'}
function closeModal(){modal.style.display='none'}function save(e){e.preventDefault();let r=Object.fromEntries(new FormData(e.target));db[cur]=db[cur]||[];if(edit<0)db[cur].push(r);else db[cur][edit]=r;log(edit<0?'Criou':'Editou',cur,r.name||r.description||'Registro');saveDB();closeModal();render()}
function del(i){if(confirm('Excluir este registro?')){let r=rows(cur).splice(i,1)[0];log('Excluiu',cur,r.name||r.description||'Registro');saveDB();render()}}
function log(action,module,detail){db.audit=db.audit||[];db.audit.push({when:new Date().toLocaleString('pt-BR'),action,module,detail})}
function filter(){let q=document.getElementById('q').value.toLowerCase(),keys=C[cur][1].map(f=>f[0]);document.getElementById('table').innerHTML=table(rows(cur).filter(r=>Object.values(r).join(' ').toLowerCase().includes(q)),keys)}
function csv(data){if(!data.length)return '';let k=[...new Set(data.flatMap(Object.keys))];return [k.join(';'),...data.map(r=>k.map(x=>'"'+String(r[x]??'').replace(/"/g,'""')+'"').join(';'))].join('\n')}
function down(n,s,t){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:t}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function csvModule(){down(cur+'.csv','\ufeff'+csv(rows(cur)),'text/csv;charset=utf-8')}function csvAll(){let a=Object.entries(db).flatMap(([m,rs])=>rs.map(r=>({modulo:m,...r})));down('gei360-relatorio.csv','\ufeff'+csv(a),'text/csv;charset=utf-8')}
function backup(){down('gei360-backup.json',JSON.stringify({company:companyName,data:db},null,2),'application/json')}function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);db=x.data||x;saveDB();render();alert('Backup restaurado')}catch(_){alert('Arquivo inválido')}};r.readAsText(f)}
const loginEl=document.getElementById('login'),app=document.getElementById('app'),msg=document.getElementById('msg'),company=document.getElementById('company'),who=document.getElementById('who'),nav=document.getElementById('nav'),title=document.getElementById('title'),view=document.getElementById('view'),modal=document.getElementById('modal'),modalTitle=document.getElementById('modalTitle');
</script></body></html>
