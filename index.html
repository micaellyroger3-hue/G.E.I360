<style>
:root{--nav:#101827;--green:#16866d;--bg:#f3f5f9;--line:#e5eaf1;--ink:#172033}*{box-sizing:border-box}body{margin:0;font:14px system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{border:0;border-radius:8px;padding:10px 14px;background:var(--green);color:#fff;font-weight:650;cursor:pointer}.alt,.secondary{background:#eaf0f5;color:#263449}button:disabled{opacity:.55;cursor:not-allowed}.danger{background:#fff0ef;color:#b83227}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#101827,#1a3a45);padding:18px}.loginbox{background:#fff;padding:28px;border-radius:16px;width:min(430px,100%);box-shadow:0 20px 60px #0003}.brand{font-size:23px;font-weight:850;letter-spacing:-1px}.brand b{color:#23a184}.muted{color:#718096}.field{display:grid;gap:5px;margin:12px 0}.field label{font-size:12px;font-weight:700;color:#526174}.field input,.field select{padding:11px;border:1px solid #dce3ec;border-radius:8px;width:100%}.shell{display:grid;grid-template-columns:235px 1fr;min-height:100vh}.side{background:var(--nav);color:white;padding:18px 12px}.side .brand{padding:4px 8px 18px}.company{padding:11px;background:#ffffff14;border-radius:8px;font-size:12px;margin-bottom:14px}.nav{display:grid;gap:4px}.nav button{background:transparent;text-align:left;color:#c1ccda}.nav button.active,.nav button:hover{background:#ffffff19;color:white}.main{min-width:0}.top{background:white;padding:15px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.content{padding:22px;max-width:1200px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}.head h1{margin:0;font-size:24px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:17px;margin-bottom:14px}.metric{font-size:28px;font-weight:800}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.search{flex:1;min-width:180px;padding:10px;border:1px solid #dce3ec;border-radius:8px}.tablewrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px}table{border-collapse:collapse;width:100%;min-width:580px}td,th{text-align:left;padding:11px;border-bottom:1px solid var(--line)}th{background:#f8fafc;color:#718096;font-size:11px;text-transform:uppercase}.small{font-size:11px;padding:6px 9px}.notice{padding:12px;background:#fff8e8;border:1px solid #f1dfb6;border-radius:9px;color:#78551a;margin:12px 0;line-height:1.5}.ok{padding:11px;background:#e9f8f2;border:1px solid #bfe8d8;border-radius:9px;color:#17664e;margin:10px 0}.err{padding:11px;background:#fff0ef;border:1px solid #f2c9c5;border-radius:9px;color:#9d3027;margin:10px 0}.modalbg{display:none;position:fixed;inset:0;z-index:1000;background:#0008;align-items:center;justify-content:center;padding:15px}.modal{background:white;padding:20px;border-radius:14px;width:min(520px,100%);max-height:90vh;overflow:auto}.empty{text-align:center;color:#718096;padding:25px}.actions{display:flex;gap:6px}
@media(max-width:800px){.shell{grid-template-columns:1fr}.side{padding:10px}.side .brand{padding:3px 7px 10px}.company{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:9px}.content{padding:14px}.top{padding:12px}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:460px){.head{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}}

.gei-dashboard{display:grid;gap:16px}.gei-welcome{background:linear-gradient(120deg,#101827,#173c43 72%,#16866d);color:#fff;border-radius:16px;padding:24px 26px;display:flex;align-items:center;justify-content:space-between;overflow:hidden}.gei-eyebrow{font-size:10px;letter-spacing:1.8px;font-weight:800;color:#8be0c4}.gei-welcome h2{font-size:25px;line-height:1.2;margin:9px 0 6px}.gei-welcome p{margin:0;color:#d1e2e1}.gei-welcome-mark{font-size:42px;font-weight:900;letter-spacing:-4px;color:#ffffff20;margin-right:10px}.gei-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.gei-kpi,.gei-panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:17px}.gei-kpi{display:grid;gap:7px}.gei-kpi span,.gei-kpi small{color:#718096}.gei-kpi span{font-size:12px;font-weight:700}.gei-kpi strong{font-size:23px;letter-spacing:-.7px}.gei-kpi small{font-size:10px}.gei-dashboard-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:12px}.gei-panel{min-width:0}.gei-panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:15px}.gei-panel-head h3{font-size:14px;margin:0 0 4px}.gei-panel-head p{font-size:11px;color:#718096;margin:0}.gei-panel-tag,.gei-count{background:#edf7f4;color:#16866d;border-radius:7px;padding:5px 8px;font-size:11px;font-weight:800}.gei-chart{height:190px;display:flex;align-items:stretch;gap:10px;padding:10px 2px 0}.gei-chart-col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:7px}.gei-chart-value{height:15px;font-size:9px;color:#718096;white-space:nowrap}.gei-chart-track{height:130px;width:min(34px,80%);background:#f1f5f7;border-radius:7px 7px 3px 3px;display:flex;align-items:flex-end;overflow:hidden}.gei-chart-bar{width:100%;min-height:3px;background:linear-gradient(180deg,#2bb58c,#16866d);border-radius:6px 6px 2px 2px}.gei-chart-col small{font-size:10px;color:#718096;text-transform:capitalize}.gei-stat-list,.gei-alert-list,.gei-recent-list{display:grid;gap:0}.gei-stat-list>div,.gei-alert-list>div,.gei-recent-list>div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eef1f5;font-size:12px}.gei-stat-list>div:last-child,.gei-alert-list>div:last-child,.gei-recent-list>div:last-child{border-bottom:0}.gei-stat-list span,.gei-alert-list span,.gei-recent-list span{color:#59677a}.gei-stat-list b,.gei-alert-list b,.gei-recent-list b{font-size:12px}.gei-alert-list b{color:#b45309}.gei-recent-list small{display:block;color:#98a2b3;font-size:10px;margin-top:3px}.gei-empty-state{padding:20px 8px;text-align:center;color:#718096;font-size:12px}.gei-footnote{font-size:10px;color:#8792a2;margin:0 2px}
@media(max-width:900px){.gei-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.gei-dashboard-grid{grid-template-columns:1fr}}
@media(max-width:460px){.gei-welcome{padding:19px}.gei-welcome h2{font-size:21px}.gei-welcome-mark{font-size:32px}.gei-kpi{padding:13px}.gei-kpi strong{font-size:19px}.gei-chart{gap:5px}.gei-chart-value{font-size:8px}}

</style></head><body>
<section id="auth" class="login"><div class="loginbox"><div class="brand">G.E.I<b>360</b></div><h2 id="authTitle">Acesse sua plataforma</h2><p class="muted">Gestão empresarial integrada</p><div id="authMessage"></div><form id="authForm"><div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label>Senha</label><input id="password" type="password" minlength="6" autocomplete="current-password" required></div><button id="authSubmit" style="width:100%">Entrar</button></form><button class="alt" id="toggleAuth" style="width:100%;margin-top:9px">Criar uma conta</button></div></section>
<div id="app" class="shell hidden"><aside class="side"><div class="brand">G.E.I<b>360</b></div><div class="company" id="companyLabel">Nenhuma empresa selecionada</div><nav class="nav"><button data-page="home" class="active">Visão geral</button><button data-page="company">Minha empresa</button><button data-page="employees">Funcionários</button><button data-page="products">Estoque</button><button data-page="stock">Movimentações</button><button data-page="suppliers">Fornecedores</button><button data-page="customers">Clientes</button><button data-page="sales">Vendas</button><button data-page="purchases">Compras</button><button data-page="finance">Financeiro</button><button data-page="documents">Documentos</button><button data-page="reports">Relatórios</button></nav></aside><main class="main"><header class="top"><b id="pageTitle">Visão geral</b><span><small id="userLabel"></small> <button class="alt small" id="logout">Sair</button></span></header><div class="content" id="view"></div></main></div>
<div class="modalbg" id="modal"><div class="modal"><div class="head"><b id="modalTitle">Funcionário</b><button class="alt small" id="closeModal">Fechar</button></div><form id="employeeForm"><input id="employeeId" type="hidden"><div class="field"><label>Nome completo</label><input id="full_name" required maxlength="120"></div><div class="field"><label>E-mail</label><input id="emp_email" type="email"></div><div class="field"><label>Telefone</label><input id="phone" maxlength="30"></div><div class="field"><label>Cargo</label><input id="job_title" maxlength="80"></div><div class="field"><label>Departamento</label><input id="department" maxlength="80"></div><div class="field"><label>Situação</label><select id="status"><option value="active">Ativo</option><option value="inactive">Inativo</option></select></div><button>Salvar funcionário</button></form></div></div>
<script>
const SUPABASE_URL='https://mxikqdarqgatqoecfprg.supabase.co';
const SUPABASE_KEY='sb_publishable_C1PaxcWAdb5rLfd0yJjl5g_ZUQKK7Dk';
let session=null,companies=[],companyId=null,companyRole=null,employees=[],signup=false,editing=false;
const SESSION_KEY='gei360_session';
function saveSession(value){session=value;try{localStorage.setItem(SESSION_KEY,JSON.stringify(value))}catch(e){}}
async function restoreSession(){
 let saved=null;
 try{
  const raw=localStorage.getItem(SESSION_KEY);if(!raw)return;
  saved=JSON.parse(raw);if(!saved?.refresh_token)throw Error('Sessão sem token de renovação.');
 }catch(e){try{localStorage.removeItem(SESSION_KEY)}catch(_){}return}
 const showApp=async()=>{
  $('auth').classList.add('hidden');$('app').classList.remove('hidden');$('userLabel').textContent=saved.user?.email||'';
 };
 try{
  const fresh=await api('/auth/v1/token?grant_type=refresh_token',{method:'POST',auth:false,body:{refresh_token:saved.refresh_token}});
  saveSession(fresh);saved=fresh;
 }catch(e){
  if(e instanceof TypeError||/failed to fetch|networkerror|load failed/i.test(e.message||'')){
   session=saved;await showApp();message($('view'),'Sem conexão com o servidor. Sua sessão foi preservada; conecte-se à internet para carregar os dados.','notice');return;
  }
  try{localStorage.removeItem(SESSION_KEY)}catch(_){}session=null;return;
 }
 try{await loadCompanies();await showApp();await render()}
 catch(e){await showApp();message($('view'),'Não foi possível carregar os dados da empresa. Verifique a conexão e tente novamente. '+e.message,'notice')}
}
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let refreshPromise=null;
async function refreshSessionToken(){
 if(!session?.refresh_token)throw Error('Sua sessão expirou. Entre novamente.');
 if(!refreshPromise){
  refreshPromise=(async()=>{
   const response=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});
   const raw=await response.text();let data=null;try{data=raw?JSON.parse(raw):null}catch(e){}
   if(!response.ok||!data?.access_token)throw Error(data?.message||data?.msg||'Não foi possível renovar sua sessão.');
   saveSession(data);return data;
  })().catch(error=>{session=null;try{localStorage.removeItem(SESSION_KEY)}catch(e){}throw Error('Sua sessão expirou. Entre novamente. '+error.message)}).finally(()=>{refreshPromise=null});
 }
 return refreshPromise;
}
async function api(path,{method='GET',body,auth=true,headers={}}={}){
 const send=async()=>{
  const h={'apikey':SUPABASE_KEY,'Content-Type':'application/json',...headers};
  if(auth&&session?.access_token)h.Authorization='Bearer '+session.access_token;
  else if(auth)throw Error('Sua sessão expirou. Entre novamente.');
  const response=await fetch(SUPABASE_URL+path,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body)});
  const raw=await response.text();let data=null;try{data=raw?JSON.parse(raw):null}catch(e){}
  return {response,raw,data};
 };
 let result=await send();
 if(result.response.status===401&&auth&&session?.refresh_token&&!path.startsWith('/auth/v1/token')){
  await refreshSessionToken();result=await send();
 }
 if(!result.response.ok)throw Error(result.data?.message||result.data?.msg||result.data?.hint||result.data?.details||result.raw||('HTTP '+result.response.status));
 return result.data;
}
function message(el,text,type='err'){el.innerHTML='<div class="'+type+'">'+esc(text)+'</div>'}
$('toggleAuth').onclick=()=>{signup=!signup;$('authTitle').textContent=signup?'Crie sua conta':'Acesse sua plataforma';$('authSubmit').textContent=signup?'Criar conta':'Entrar';$('toggleAuth').textContent=signup?'Já tenho conta':'Criar uma conta';$('password').autocomplete=signup?'new-password':'current-password';$('authMessage').innerHTML=''};
$('authForm').onsubmit=async e=>{e.preventDefault();$('authSubmit').disabled=true;$('authMessage').innerHTML='';try{const email=$('email').value.trim(),password=$('password').value;let data;if(signup){data=await api('/auth/v1/signup',{method:'POST',auth:false,body:{email,password}});if(!data?.access_token){message($('authMessage'),'Conta criada. Confirme seu e-mail pelo link enviado e depois entre.','ok');return}saveSession(data)}else{saveSession(await api('/auth/v1/token?grant_type=password',{method:'POST',auth:false,body:{email,password}}))}await loadCompanies();$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('userLabel').textContent=email;render()}catch(err){message($('authMessage'),err.message)}finally{$('authSubmit').disabled=false}};
async function loadCompanies(){companies=await api('/rest/v1/companies?select=id,name,tax_id,created_at&order=created_at.asc');if(!Array.isArray(companies))companies=[];companyId=companies[0]?.id||null}
function setPage(page){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('pageTitle').textContent=({home:'Visão geral',company:'Minha empresa',employees:'Funcionários'})[page];if(page==='home')renderHome();if(page==='company')renderCompany();if(page==='employees')renderEmployees()}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>setPage(b.dataset.page));
function render(){if(!companyId){$('companyLabel').textContent='Cadastre sua empresa';setPage('company')}else{$('companyLabel').textContent=companies.find(c=>c.id===companyId)?.name||'Empresa';setPage('home')}}
function renderHome(){$('view').innerHTML='<div class="head"><div><h1>Visão geral</h1><span class="muted">Resumo da sua empresa</span></div></div><div class="grid"><div class="card"><span class="muted">Empresas vinculadas</span><div class="metric">'+companies.length+'</div></div><div class="card"><span class="muted">Funcionários</span><div class="metric">'+employees.length+'</div></div><div class="card"><span class="muted">Seu perfil</span><div style="font-size:19px;font-weight:750">'+esc(companyRole||'Membro')+'</div></div></div><div class="card"><b>Bem-vindo ao G.E.I360</b><p class="muted">Painel inicial do G.E.I360. Os módulos operacionais carregam os dados diretamente do banco da empresa.</p><button onclick="setPage(\'employees\')">Gerenciar funcionários</button></div>'}
function renderCompany(){$('view').innerHTML='<div class="head"><div><h1>Minha empresa</h1><span class="muted">Cadastro e identificação empresarial</span></div></div><div class="card"><form id="companyForm"><div class="field"><label>Razão social / nome da empresa</label><input id="companyName" required maxlength="160" value="'+esc(companies.find(c=>c.id===companyId)?.name||'')+'"></div><div class="field"><label>CNPJ (opcional)</label><input id="taxId" maxlength="20" value="'+esc(companies.find(c=>c.id===companyId)?.tax_id||'')+'"></div><button>Salvar empresa</button></form></div>'+(companies.length>1?'<div class="card"><b>Empresas vinculadas</b>'+companies.map(c=>'<p>'+esc(c.name)+' <button class="alt small" onclick="switchCompany(\''+c.id+'\')">Selecionar</button></p>').join('')+'</div>':'')}
$('view').addEventListener('submit',async e=>{if(e.target.id!=='companyForm')return;e.preventDefault();const name=$('companyName').value.trim(),tax_id=$('taxId').value.trim()||null;let createdCompanyId=null;try{if(companyId){await api('/rest/v1/companies?id=eq.'+companyId,{method:'PATCH',body:{name,tax_id}})}else{const created=await api('/rest/v1/companies?select=id,name,tax_id',{method:'POST',headers:{Prefer:'return=representation'},body:{name,tax_id,created_by:session.user.id}});const c=created?.[0];if(!c)throw Error('O banco não retornou a empresa criada.');createdCompanyId=c.id;await api('/rest/v1/company_members',{method:'POST',body:{company_id:c.id,user_id:session.user.id,role:'owner',status:'active'}})}await loadCompanies();companyId=createdCompanyId||companies.find(c=>c.id===companyId)?.id||companies[0]?.id||null;$('companyLabel').textContent=companies.find(c=>c.id===companyId)?.name||name;await render()}catch(err){message($('view'),err.message)}});
async function switchCompany(id){companyId=id;await loadEmployees();render()}
async function loadEmployees(){if(!companyId){employees=[];return}employees=await api('/rest/v1/employees?select=id,full_name,email,phone,job_title,department,status,created_at&company_id=eq.'+companyId+'&order=created_at.desc')}
async function renderEmployees(){try{await loadEmployees();const canEdit=['owner','admin','manager'].includes(companyRole);$('view').innerHTML='<div class="head"><div><h1>Funcionários</h1><span class="muted">Equipe vinculada à empresa selecionada</span></div>'+(canEdit?'<button type="button" id="newEmployee">+ Novo funcionário</button>':'')+'</div><div class="toolbar"><input id="searchEmployees" class="search" placeholder="Pesquisar funcionário..."></div><div id="employeeTable"></div>';drawEmployees();$('searchEmployees').oninput=drawEmployees;if(canEdit)$('newEmployee').onclick=()=>window.openEmployee()}catch(err){$('view').innerHTML='<div class="err"><b>Não foi possível carregar os funcionários.</b><br>Verifique a conexão, a sessão e as permissões do Supabase.<br>Detalhe: '+esc(err.message)+'</div>'}}
function drawEmployees(){const q=($('searchEmployees')?.value||'').toLowerCase(),list=employees.filter(e=>[e.full_name,e.email,e.job_title,e.department].join(' ').toLowerCase().includes(q)),canEdit=['owner','admin','manager'].includes(companyRole),canDelete=['owner','admin'].includes(companyRole);$('employeeTable').innerHTML=list.length?'<div class="tablewrap"><table><thead><tr><th>Nome</th><th>E-mail</th><th>Cargo</th><th>Departamento</th><th>Situação</th><th>Ações</th></tr></thead><tbody>'+list.map(e=>'<tr><td>'+esc(e.full_name)+'</td><td>'+esc(e.email)+'</td><td>'+esc(e.job_title)+'</td><td>'+esc(e.department)+'</td><td>'+(e.status==='active'?'Ativo':'Inativo')+'</td><td><div class="actions">'+(canEdit?'<button class="alt small" data-employee-edit="'+e.id+'">Editar</button>':'<span class="muted">Consulta</span>')+(canDelete?'<button class="danger small" data-employee-delete="'+e.id+'">Excluir</button>':'')+'</div></td></tr>').join('')+'</tbody></table></div>':'<div class="card empty">Nenhum funcionário cadastrado.</div>';document.querySelectorAll('[data-employee-edit]').forEach(b=>b.onclick=()=>openEmployee(b.dataset.employeeEdit));document.querySelectorAll('[data-employee-delete]').forEach(b=>b.onclick=()=>deleteEmployee(b.dataset.employeeDelete))}
window.openEmployee=function(id=''){try{const e=employees.find(x=>x.id===id)||{};editing=!!id;$('modalTitle').textContent=id?'Editar funcionário':'Novo funcionário';$('employeeId').value=id;$('full_name').value=e.full_name||'';$('emp_email').value=e.email||'';$('phone').value=e.phone||'';$('job_title').value=e.job_title||'';$('department').value=e.department||'';$('status').value=e.status||'active';const modal=$('modal');modal.style.display='flex';modal.setAttribute('aria-hidden','false');}catch(err){message($('view'),'Não foi possível abrir o cadastro: '+err.message)}};
$('closeModal').onclick=()=>$('modal').style.display='none';
$('employeeForm').onsubmit=async e=>{e.preventDefault();const id=$('employeeId').value,payload={company_id:companyId,full_name:$('full_name').value.trim(),email:$('emp_email').value.trim()||null,phone:$('phone').value.trim()||null,job_title:$('job_title').value.trim()||null,department:$('department').value.trim()||null,status:$('status').value};try{if(id)await api('/rest/v1/employees?id=eq.'+id,{method:'PATCH',body:payload});else await api('/rest/v1/employees',{method:'POST',body:{...payload,created_by:session.user.id}});$('modal').style.display='none';await renderEmployees()}catch(err){alert('Não foi possível salvar: '+err.message)}};
async function deleteEmployee(id){if(!confirm('Excluir este cadastro de funcionário?'))return;try{await api('/rest/v1/employees?id=eq.'+id,{method:'DELETE'});await renderEmployees()}catch(err){alert(err.message)}}
async function loadRole(){if(!companyId){companyRole=null;return}const m=await api('/rest/v1/company_members?select=role,status&company_id=eq.'+companyId+'&user_id=eq.'+session.user.id+'&limit=1');companyRole=m?.[0]?.status==='active'?m[0].role:null}
const oldRender=render;render=async function(){if(companyId)await loadRole();$('companyLabel').textContent=companies.find(c=>c.id===companyId)?.name||'Cadastre sua empresa';if(!companyId)setPage('company');else setPage('home')};
$('logout').onclick=async()=>{try{if(session?.access_token)await api('/auth/v1/logout',{method:'POST'})}catch(e){}try{localStorage.removeItem(SESSION_KEY)}catch(e){}session=null;companies=[];companyId=null;companyRole=null;employees=[];$('app').classList.add('hidden');$('auth').classList.remove('hidden');$('password').value=''};
restoreSession();
</script><script src="./modules.js?v=20261109-13"></script><script>if('serviceWorker' in navigator && location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('G.E.I360 offline shell:',err)));}</script></body></html>
