name: Validate G.E.I360 changes

on:
  pull_request:
    branches: ["main"]
  push:
    branches:
      - "dev/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate application and database migrations
        run: node scripts/validate.mjs
