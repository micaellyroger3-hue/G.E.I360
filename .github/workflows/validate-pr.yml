name: Validate G.E.I360 changes

on:
  pull_request:
    branches: ["main"]
  push:
    branches:
      - "feat/**"
      - "integration/**"
      - "main"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate application and database migrations
        run: node scripts/validate.mjs
